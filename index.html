ant;min-height:var(--vb-design-h)!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;transform-origin:center center!important;transform:translate(-50%,-50%) scale(var(--vb-fit-scale,1))!important;overflow:hidden!important}\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv id=\"focusBar\" class=\"focus-bar\" hidden=\"\">\u003cbutton id=\"exitFocus\" class=\"secondary\">↙ もどる\u003c/button>\u003cdiv class=\"focus-switch\">\u003cbutton id=\"focusTable\" aria-pressed=\"true\">カード\u003c/button>\u003cbutton id=\"focusWorld\" aria-pressed=\"false\">せかい\u003c/button>\u003c/div>\u003cdiv class=\"focus-actions\">\u003cbutton id=\"focusUndo\" class=\"quiet\" disabled=\"\">↶ もどす\u003c/button>\u003cbutton id=\"focusCommit\" class=\"primary\" disabled=\"\">せかいを かえる\u003c/button>\u003c/div>\u003c/div>\n\u003cheader>\u003ca class=\"brand\" href=\"./\" aria-label=\"ことばのにわ ホーム\">\u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cpath d=\"M20 34V17\" stroke=\"currentColor\" stroke-width=\"3\">\u003c/path>\u003cpath d=\"M20 25C3 24 5 8 7 8c14 0 14 11 13 17M20 19C18 5 32 4 34 5c2 12-7 16-14 14\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003cspan>ことばタウン\u003c/span>\u003csmall>試作版 v0.4\u003c/small>\u003c/a>\u003cnav>\u003cbutton id=\"sound\" class=\"quiet\" aria-pressed=\"true\">音声 オン\u003c/button>\u003cbutton id=\"adult\" class=\"quiet\">おとなのメニュー \u003cspan>☰\u003c/span>\u003c/button>\u003c/nav>\u003c/header>\n\u003cmain data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"position: relative !important; left: 0.709448px !important; top: -37.723px !important; overflow: hidden !important; clip-path: inset(0px) !important; padding: 26px !important; width: 1194px !important; height: 899.987px !important;\">\u003csection class=\"intro\">\u003cdiv>\u003cspan class=\"eyebrow\">ことばで、つくろう。\u003c/span>\u003ch1>ならべたことばが、\u003cbr class=\"mobile\">せかいになる。\u003c/h1>\u003cp>みちをつなげて。たねをまいて。つぎは、なにをおこう？\u003c/p>\u003c/div>\u003cdiv class=\"mode-switch\" aria-label=\"遊び方\">\u003cbutton id=\"growMode\" class=\"active\" aria-pressed=\"true\">つづけて そだてる\u003csmall>まえの せかいが のこる\u003c/small>\u003c/button>\u003cbutton id=\"freeMode\" aria-pressed=\"false\">じゆうに ならべる\u003csmall>ならべた かたちに へんしん\u003c/small>\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"workspace\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"position: relative !important; left: -5.14294px !important; top: -35.9748px !important; overflow: hidden !important; clip-path: inset(0px) !important; width: 1142px !important; height: 619.434px !important; margin: 4.172px !important;\">\u003caside class=\"palette\">\u003cdiv class=\"section-title\">\u003cspan class=\"step\">1\u003c/span>\u003ch2>ことばを えらぶ\u003c/h2>\u003c/div>\u003cp class=\"hint\">えらんで、となりに おこう。\u003c/p>\u003cdiv id=\"words\" class=\"words\">\u003c/div>\u003cbutton id=\"eraser\" class=\"eraser\" aria-pressed=\"false\">⌫ カードを とる\u003c/button>\u003cdiv class=\"palette-note\">\u003cspan class=\"tiny-leaf\">✳\u003c/span>\u003cp>おなじ ことばを\u003cbr>いくつ おいても いいよ。\u003c/p>\u003c/div>\u003c/aside>\n\u003csection class=\"table-panel\">\u003cdiv class=\"panel-head\">\u003cdiv class=\"section-title\">\u003cspan class=\"step\">2\u003c/span>\u003ch2>カードを おく\u003c/h2>\u003c/div>\u003cdiv class=\"panel-buttons\">\u003cspan id=\"count\" class=\"pill\">0 まい\u003c/span>\u003cbutton id=\"expandTable\" class=\"expand\" aria-label=\"カードを置く画面を全画面表示\">⛶ おおきく\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"focusWords\" class=\"focus-words\" aria-label=\"全画面のことば選び\">\u003c/div>\u003cdiv class=\"orientation\">● こちらが うえ\u003c/div>\u003cdiv id=\"table\" class=\"board tabletop\" role=\"group\" aria-label=\"カードを置く台紙、４行４列\">\u003c/div>\u003cdiv class=\"table-tools\">\u003cbutton id=\"photo\" class=\"quiet\">▣ しゃしんから\u003c/button>\u003cbutton id=\"clear\" class=\"quiet\">カードを かたづける\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"world-panel\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"overflow: hidden !important; clip-path: inset(0px) !important;\">\u003cdiv class=\"panel-head\">\u003cdiv class=\"section-title\">\u003cspan class=\"world-dot\">\u003c/span>\u003ch2>ことばの せかい\u003c/h2>\u003c/div>\u003cdiv class=\"panel-buttons\">\u003cspan id=\"turn\" class=\"pill green\">ターン 0\u003c/span>\u003cbutton id=\"expandWorld\" class=\"expand\" aria-label=\"絵の世界を全画面表示\">⛶ おおきく\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"orientation world-orientation\">● こちらが うえ\u003c/div>\u003cdiv id=\"world\" class=\"board world\" role=\"group\" aria-label=\"ことばの世界\">\u003c/div>\u003cdiv class=\"world-tools\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"position: relative !important; left: -2.64063px !important; top: -3.8537px !important; overflow: hidden !important; clip-path: inset(0px) !important;\">\u003cbutton id=\"labels\" class=\"quiet\" aria-pressed=\"true\">もじを みせる ✓\u003c/button>\u003cspan>えを さわってみよう\u003c/span>\u003c/div>\u003c/section>\u003c/section>\n\u003csection class=\"actionbar\" data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"left: 5.01301px !important; top: 96.564px !important; overflow: hidden !important; clip-path: inset(0px) !important; width: 1142px !important; height: 87.6805px !important; margin: -25.969px !important;\">\u003cdiv>\u003cspan id=\"status\" role=\"status\" aria-live=\"polite\">すきな ことばを えらんで、カードを おこう。\u003c/span>\u003cp id=\"substatus\">はたけ → たね → みず で、やさいが そだつよ。\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"undo\" class=\"undo\" disabled=\"\">↶ ひとつ もどす\u003c/button>\u003cbutton id=\"commit\" class=\"primary\" disabled=\"\">せかいを かえる \u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\u003c/section>\n\u003cfooter data-vb-frame-clip=\"{&quot;overflow&quot;:[&quot;&quot;,&quot;&quot;],&quot;clip-path&quot;:[&quot;&quot;,&quot;&quot;]}\" style=\"position: relative !important; left: 0px !important; top: 43.9469px !important; overflow: hidden !important; clip-path: inset(0px) !important;\">\u003cspan>ちいさな ことばから、ひろがる せかい。\u003c/span>\u003cspan id=\"saveStatus\">この端末に自動保存\u003c/span>\u003c/footer>\u003c/main>\n\u003cdialog id=\"adultDialog\">\u003cdiv class=\"dialog-head\">\u003ch2>おとなのメニュー\u003c/h2>\u003cbutton class=\"close\" data-close=\"\" aria-label=\"閉じる\">×\u003c/button>\u003c/div>\u003cp>言葉全体の形と、意味・音のつながりを楽しむ試作です。\u003c/p>\u003cdiv class=\"menu-section\">\u003ch3>紙のカードで遊ぶ\u003c/h3>\u003cp>台紙は４×４マス。カードは１マスに１枚、横向きに置きます。写真を取り込むと四隅の目印を探します。候補を確認し、ずれていれば手動で指定すると台紙を補正できます。読み取り結果を確認してから世界に反映できます。\u003c/p>\u003cp class=\"notice\">写真の読み取りは試験機能です。印刷モードは形の照合を優先します。手書きモードは登録した手本と照合し、未登録の形には平仮名に絞った文字認識も試します。初回の文字認識は日本語データをダウンロードします。写真は端末内で処理し、保存しません。四隅の検出は撮影条件に左右されます。手動で修正できます。\u003c/p>\u003cdiv class=\"button-row\">\u003ca class=\"secondary\" href=\"print.html?type=board\" target=\"_blank\">台紙を印刷 ↗\u003c/a>\u003ca class=\"secondary\" href=\"print.html?type=cards\" target=\"_blank\">文字カードを印刷 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"menu-section\">\u003ch3>画面を大きくする\u003c/h3>\u003cp>カード・世界の各画面の「おおきく」で、その画面だけを表示できます。上の「カード」「せかい」で切り替え、「もどる」で元の並びに戻ります。iPadなどではブラウザのバーが残る場合があります。\u003c/p>\u003ch3>遊び方\u003c/h3>\u003cp>「つづけて そだてる」では、カードを片付けても世界は残ります。畑に種を置くと芽が出て、水を２回置くと野菜になります。畑のない場所の種は、そのまま残ります。\u003c/p>\u003cp>「じゆうに ならべる」では、台の好きな場所にカードを置けます。絵は今のカードの配置に置き換わります。鳥はランダムな場所まで弧を描いて飛び、元の場所に戻ります。車はつながった道の遠い端まで往復します（輪になった道では遠い地点まで）。写真の取り込みは４×４のモードに対応しています。\u003c/p>\u003clabel class=\"setting\">\u003cinput id=\"reduced\" type=\"checkbox\"> 動きをひかえめにする\u003c/label>\u003c/div>\u003cdiv class=\"menu-section\">\u003ch3>手書きの手本\u003c/h3>\u003cp>直した文字の形を、このブラウザだけに保存します。写真そのものは保存しません。別の書き方も追加できます（１語20枚・全体200枚まで）。仮候補が正しいことを確認してから登録してください。\u003c/p>\u003cp>対応する絵がない新しい言葉も入力できます。「絵なし」なら文字のまま世界に置き、絵を選べばその絵と結びつけます。\u003c/p>\u003cp id=\"sampleCount\">\u003c/p>\u003cdiv id=\"sampleList\" class=\"sample-list\">\u003c/div>\u003ch3>保存とやりなおし\u003c/h3>\u003cp>２つのモードは別々に、このブラウザに保存します。端末やブラウザを変えると引き継がれません。\u003c/p>\u003cbutton id=\"reset\" class=\"danger\">いまのモードを はじめから\u003c/button>\u003cdiv id=\"resetConfirm\" hidden=\"\">\u003cp>いまのモードの世界とカードを消しますか？\u003c/p>\u003cbutton id=\"doReset\" class=\"danger\">消して はじめる\u003c/button> \u003cbutton id=\"cancelReset\" class=\"secondary\">やめる\u003c/button>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"photoDialog\" class=\"photo-dialog\">\u003cdiv class=\"dialog-head\">\u003ch2>手書き・印刷カードを取り込む\u003c/h2>\u003cbutton class=\"close\" data-close=\"\" aria-label=\"閉じる\">×\u003c/button>\u003c/div>\u003cdiv class=\"reading-settings\">\u003clabel>読み方\u003cselect id=\"readingMode\">\u003coption value=\"handwriting\">手書き（平仮名の仮候補を出す）\u003c/option>\u003coption value=\"print\">印刷カード（速い照合）\u003c/option>\u003c/select>\u003c/label>\u003clabel>撮るもの\u003cselect id=\"captureLayout\">\u003coption value=\"board\">４×４の台紙\u003c/option>\u003coption value=\"single\">カード１枚（手本登録にも）\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp id=\"photoGuide\">台紙の四隅まで入れて撮影してください。\u003c/p>\u003cp class=\"notice\">手書きは未登録でも文字認識を試し、読めなければ形の近い言葉を仮候補にします。初回は日本語データのダウンロードが必要です。仮候補が正しいか、大人が確認してから確定してください。\u003c/p>\u003clabel class=\"file-button secondary\">写真を撮る・選ぶ\u003cinput type=\"file\" accept=\"image/*\" capture=\"environment\" id=\"file\">\u003c/label>\u003cdiv id=\"photoArea\" hidden=\"\">\u003cp id=\"photoInstruction\" role=\"status\">台紙の左上の目印の中心を押してください。\u003c/p>\u003ccanvas id=\"photoCanvas\" aria-label=\"台紙の四隅を指定する写真\">\u003c/canvas>\u003cdiv class=\"button-row\">\u003cbutton id=\"cornersReset\" class=\"secondary\">四隅を指定しなおす\u003c/button>\u003cbutton id=\"recognize\" class=\"primary\" disabled=\"\">文字を読み取る\u003c/button>\u003c/div>\u003cprogress id=\"progress\" max=\"16\" value=\"0\" hidden=\"\">\u003c/progress>\u003c/div>\u003cp id=\"photoMessage\" role=\"status\">\u003c/p>\u003cbutton id=\"stopOcr\" class=\"secondary\" hidden=\"\">文字認識を止めて、選択・入力で直す\u003c/button>\u003cdiv id=\"review\" hidden=\"\">\u003cdiv class=\"review-heading\">\u003ch3>読み取り結果を確認\u003c/h3>\u003cbutton id=\"showPhotoBounds\" class=\"quiet\">写真・四隅を見直す\u003c/button>\u003c/div>\u003cp>写真と見比べ、仮の読みが違えば候補を選ぶか、ひらがなを入力してください。直したカードは「手本にする」がオンになります。正しく読めたカードも、チェックすると手本にできます。保存は下のボタンで確定します。\u003c/p>\u003cdatalist id=\"wordChoices\">\u003c/datalist>\u003cdiv id=\"reviewGrid\" class=\"review-grid\">\u003c/div>\u003clabel id=\"singlePlacement\" class=\"single-placement\" hidden=\"\">このカードを置くマス\u003cselect id=\"singleTarget\">\u003c/select>\u003c/label>\u003cbutton id=\"shapeRetry\" class=\"secondary\">手本も使ってもう一度照合\u003c/button>\u003cbutton id=\"ocrRetry\" class=\"secondary\" hidden=\"\">平仮名の文字認識をもう一度試す\u003c/button>\u003cdiv class=\"button-row\">\u003cbutton id=\"saveSamples\" class=\"secondary\" disabled=\"\">選んだ手本だけ保存\u003c/button>\u003cbutton id=\"acceptPhoto\" class=\"primary\">確認して台紙に置く\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"notice\">写真は世界に自動反映されません。台紙に取り込んだあと「せかいを かえる」を押してください。\u003c/p>\u003c/dialog>\n\u003cscript type=\"module\" src=\"./app.js\">\u003c/script>\n\u003cscript id=\"__vb_device_layout_script\">(function(){function n(v){var x=parseFloat(v);return isFinite(x)?x:0}function fit(){var cs=getComputedStyle(document.documentElement),sat=n(cs.getPropertyValue('--vb-sat')),sab=n(cs.getPropertyValue('--vb-sab')),sal=n(cs.getPropertyValue('--vb-sal')),sar=n(cs.getPropertyValue('--vb-sar')),aw=Math.max(1,innerWidth-sal-sar),ah=Math.max(1,innerHeight-sat-sab),s=Math.min(aw/1194,ah/1014);document.body.style.setProperty('--vb-fit-scale',String(Math.max(.05,s)));document.body.style.left=(sal+aw/2)+'px';document.body.style.top=(sat+ah/2)+'px'}addEventListener('resize',fit,{passive:true});addEventListener('orientationchange',fit,{passive:true});i
