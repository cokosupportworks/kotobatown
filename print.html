<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ことばタウン"><title>ことばタウン・印刷</title><style>*{box-sizing:border-box}body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;margin:0;color:#111}header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:#f4f4e9;text-align:center;border-bottom:1px solid #dce3d0}.print-actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.return-town{display:inline-flex;align-items:center;min-height:48px;padding:12px 16px;border:1px solid #637a5d;border-radius:7px;background:#e5eedc;color:#344b3e;text-decoration:none;font-size:16px;font-weight:600}header button{min-height:48px;color:#344b3e;cursor:pointer}.return-town:focus-visible,header button:focus-visible{outline:3px solid #c96f44;outline-offset:3px}header button{padding:12px 22px;font-size:16px;border:1px solid #637a5d;background:white;border-radius:6px}header p{font-size:13px}.sheet{width:190mm;margin:15mm auto;break-after:page}h1{font-size:15pt;margin:0 0 10mm;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);width:164mm;height:164mm;margin:0 auto;border:0.4mm solid #aaa;position:relative}.cell{border-right:.3mm dashed #ccc;border-bottom:.3mm dashed #ccc}.cell:nth-child(4n){border-right:0}.cell:nth-last-child(-n+4){border-bottom:0}.marker{position:absolute;width:5mm;height:5mm;background:#000;transform:translate(-50%,-50%);-webkit-print-color-adjust:exact;print-color-adjust:exact}.tl{left:0;top:0}.tr{left:100%;top:0}.br{left:100%;top:100%}.bl{left:0;top:100%}.top{text-align:center;font-size:12pt;margin-bottom:6mm;color:#466955}.note{text-align:center;font-size:10pt;line-height:1.8;margin-top:10mm}.cards{display:grid;grid-template-columns:repeat(4,35mm);gap:7mm;justify-content:center}.card{width:35mm;height:25mm;border:.3mm dashed #aaa;display:flex;align-items:center;justify-content:center;font-size:21pt;font-weight:600;letter-spacing:.04em;white-space:nowrap}.cards-sheet h1{margin-bottom:6mm}.cards-sheet .note{margin-top:6mm}@page{size:A4 portrait;margin:10mm}@media print{header{display:none}.sheet{margin:5mm auto;width:100%}.note{color:#333}}
</style></head><body><header><div class="print-actions"><a id="returnToTown" class="return-town" href="./">← ことばタウンに もどる</a><button onclick="window.print()">印刷する</button></div><p>用紙：A4・縦 ／ 倍率：100% ／ ヘッダー・フッター：オフ</p></header><main id="content"></main><script type="module">import{WORDS}from'./core.js';const type=new URLSearchParams(location.search).get('type');if(type==='cards'){document.getElementById('content').innerHTML=Array.from({length:2},(_,p)=>`<section class="sheet cards-sheet"><h1>ことばタウン・文字カード ${p+1}/2</h1><div class="cards">${WORDS.slice(p*5,p*5+5).flatMap(w=>Array(4).fill(`<div class="card">${w}</div>`)).join('')}</div><p class="note">点線で切り離してください。カードの文字が台紙の中央に来るように置いてください。<br>同じカードをさらに使いたいときは、必要なページを追加で印刷してください。</p></section>`).join('');}else{document.getElementById('content').innerHTML=`<section class="sheet"><h1>ことばタウン・４×４の台紙</h1><div class="top">● こちらが うえ</div><div class="grid">${'<div class="cell"></div>'.repeat(16)}<i class="marker tl"></i><i class="marker tr"></i><i class="marker br"></i><i class="marker bl"></i></div><p class="note">１マスに１枚、文字を横向きにして中央に置いてください。<br>撮影するときは四隅の黒い目印をすべて写してください。<br>写真では、左上→右上→右下→左下の順に、黒い目印の中心を指定します。</p></section>`;}</script></body></html>
